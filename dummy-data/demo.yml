---
title: "Homer demo"
subtitle: "Every smart card, on mock data"
footer: false

services:
  - name: "Media"
    icon: "fas fa-film"
    items:
      - name: "Emby"
        type: "Emby"
        icon: "fas fa-play-circle"
        endpoint: "/dummy-data/emby"
        libraryType: "movies"
      - name: "Jellystat"
        type: "Jellystat"
        icon: "fas fa-chart-pie"
        endpoint: "/dummy-data/jellystat"
      - name: "Plex"
        type: "Plex"
        icon: "fas fa-tv"
        endpoint: "/dummy-data/plex"
      - name: "Tautulli"
        type: "Tautulli"
        icon: "fas fa-chart-line"
        endpoint: "/dummy-data/tautulli"
      - name: "Seerr"
        type: "Seerr"
        icon: "fas fa-magnifying-glass"
        endpoint: "/dummy-data/seerr"
      - name: "Immich"
        type: "Immich"
        icon: "fas fa-images"
        endpoint: "/dummy-data/immich"

  - name: "Downloads"
    icon: "fas fa-download"
    items:
      - name: "Radarr"
        type: "Radarr"
        icon: "fas fa-video"
        endpoint: "/dummy-data/radarr"
      - name: "Sonarr"
        type: "Sonarr"
        icon: "fas fa-tv"
        endpoint: "/dummy-data/sonarr"
      - name: "Lidarr"
        type: "Lidarr"
        icon: "fas fa-music"
        endpoint: "/dummy-data/lidarr"
      - name: "Readarr"
        type: "Readarr"
        icon: "fas fa-book"
        endpoint: "/dummy-data/readarr"
      - name: "Medusa"
        type: "Medusa"
        icon: "fas fa-tv"
        endpoint: "/dummy-data/medusa"
      - name: "Mylar"
        type: "Mylar"
        icon: "fas fa-book-open"
        endpoint: "/dummy-data/mylar"
        apikey: "demo"
      - name: "Prowlarr"
        type: "Prowlarr"
        icon: "fas fa-satellite-dish"
        endpoint: "/dummy-data/prowlarr"
      - name: "SABnzbd"
        type: "SABnzbd"
        icon: "fas fa-newspaper"
        endpoint: "/dummy-data/sabnzbd"
      - name: "qBittorrent"
        type: "qBittorrent"
        icon: "fas fa-arrow-down-up-across-line"
        endpoint: "/dummy-data/qbittorrent"
      - name: "Transmission"
        type: "Transmission"
        icon: "fas fa-arrow-down-up-across-line"
        endpoint: "/dummy-data/transmission"
      - name: "rTorrent"
        type: "Rtorrent"
        icon: "fas fa-arrow-down-up-across-line"
        xmlrpc: "/dummy-data/rtorrent"
      - name: "Tdarr"
        type: "Tdarr"
        icon: "fas fa-gears"
        endpoint: "/dummy-data/tdarr"

  - name: "Monitoring"
    icon: "fas fa-heart-pulse"
    items:
      - name: "Gatus"
        type: "Gatus"
        icon: "fas fa-heart-pulse"
        endpoint: "/dummy-data/gatus"
      - name: "Healthchecks"
        type: "Healthchecks"
        icon: "fas fa-clipboard-check"
        endpoint: "/dummy-data/healthchecks"
        apikey: "demo"
      - name: "Prometheus"
        type: "Prometheus"
        icon: "fas fa-fire"
        endpoint: "/dummy-data/prometheus"
      - name: "Uptime Kuma"
        type: "UptimeKuma"
        icon: "fas fa-signal"
        endpoint: "/dummy-data/uptimekuma"
      - name: "Glances"
        type: "Glances"
        icon: "fas fa-microchip"
        endpoint: "/dummy-data/glances"
        stats: ["load", "cpu", "mem", "swap"]
      - name: "Beszel"
        type: "Beszel"
        icon: "fas fa-server"
        endpoint: "/dummy-data/beszel"
      - name: "Scrutiny"
        type: "Scrutiny"
        icon: "fas fa-hard-drive"
        endpoint: "/dummy-data/scrutiny"
      - name: "Speedtest Tracker"
        type: "SpeedtestTracker"
        icon: "fas fa-gauge-high"
        endpoint: "/dummy-data/speedtesttracker"
      - name: "Ping"
        type: "Ping"
        icon: "fas fa-satellite"
        endpoint: "/dummy-data/ping"
      - name: "PeaNUT"
        type: "PeaNUT"
        icon: "fas fa-car-battery"
        endpoint: "/dummy-data/peanut"
        device: "ups"

  - name: "Network & security"
    icon: "fas fa-shield-halved"
    items:
      - name: "AdGuard Home"
        type: "AdGuardHome"
        icon: "fas fa-shield"
        endpoint: "/dummy-data/adguardhome"
      - name: "Pi-hole"
        type: "PiHole"
        icon: "fas fa-filter"
        endpoint: "/dummy-data/pihole"
      - name: "Pi.Alert"
        type: "PiAlert"
        icon: "fas fa-bell"
        endpoint: "/dummy-data/pialert"
      - name: "NetAlertX"
        type: "NetAlertx"
        icon: "fas fa-network-wired"
        endpoint: "/dummy-data/netalertx"
      - name: "Traefik"
        type: "Traefik"
        icon: "fas fa-route"
        endpoint: "/dummy-data/traefik"
      - name: "Authelia"
        type: "Authelia"
        icon: "fas fa-user-lock"
        endpoint: "/dummy-data/authelia"
      - name: "Vaultwarden"
        type: "Vaultwarden"
        icon: "fas fa-key"
        endpoint: "/dummy-data/vaultwarden"

  - name: "Infrastructure"
    icon: "fas fa-server"
    items:
      - name: "Proxmox"
        type: "Proxmox"
        icon: "fas fa-cubes"
        endpoint: "/dummy-data/proxmox"
        node: "node1"
      - name: "Portainer"
        type: "Portainer"
        icon: "fab fa-docker"
        endpoint: "/dummy-data/portainer"
      - name: "Docker socket proxy"
        type: "DockerSocketProxy"
        icon: "fab fa-docker"
        endpoint: "/dummy-data/dockersocketproxy"
      - name: "What's up Docker"
        type: "WUD"
        icon: "fas fa-arrows-rotate"
        endpoint: "/dummy-data/wud"
      - name: "TrueNAS Scale"
        type: "TruenasScale"
        icon: "fas fa-database"
        endpoint: "/dummy-data/truenasscale"
      - name: "Gitea"
        type: "Gitea"
        icon: "fas fa-code-branch"
        endpoint: "/dummy-data/gitea"
      - name: "OliveTin"
        type: "Olivetin"
        icon: "fas fa-terminal"
        endpoint: "/dummy-data/olivetin"
      - name: "Matrix"
        type: "Matrix"
        icon: "fas fa-comments"
        endpoint: "/dummy-data/matrix"
      - name: "Nextcloud"
        type: "Nextcloud"
        icon: "fas fa-cloud"
        endpoint: "/dummy-data/nextcloud"

  - name: "Home"
    icon: "fas fa-house"
    items:
      - name: "Home Assistant"
        type: "HomeAssistant"
        icon: "fas fa-house-signal"
        endpoint: "/dummy-data/homeassistant"
        items: ["name", "version", "entities"]
      - name: "openHAB"
        type: "OpenHAB"
        icon: "fas fa-lightbulb"
        endpoint: "/dummy-data/openhab"
        things: true
        items: true
      - name: "HyperHDR"
        type: "HyperHDR"
        icon: "fas fa-palette"
        endpoint: "/dummy-data/hyperhdr"
      - name: "Weather"
        type: "OpenWeather"
        endpoint: "/dummy-data/openweather/weather"
        location: "Lille"
        units: "metric"
        apikey: "demo"
      - name: "OctoPrint"
        type: "OctoPrint"
        icon: "fas fa-print"
        endpoint: "/dummy-data/octoprint"
      - name: "Mealie"
        type: "Mealie"
        icon: "fas fa-utensils"
        endpoint: "/dummy-data/mealie"

  - name: "Productivity"
    icon: "fas fa-briefcase"
    items:
      - name: "Memos"
        type: "Memos"
        icon: "fas fa-note-sticky"
        endpoint: "/dummy-data/memos"
      - name: "Miniflux"
        type: "Miniflux"
        icon: "fas fa-rss"
        endpoint: "/dummy-data/miniflux"
      - name: "FreshRSS"
        type: "FreshRSS"
        icon: "fas fa-rss"
        endpoint: "/dummy-data/freshrss"
      - name: "Wallabag"
        type: "Wallabag"
        icon: "fas fa-bookmark"
        endpoint: "/dummy-data/wallabag"
      - name: "Linkding"
        type: "Linkding"
        icon: "fas fa-link"
        endpoint: "/dummy-data/linkding"
      - name: "LibrisLog"
        type: "LibrisLog"
        icon: "fas fa-book"
        endpoint: "/dummy-data/librislog"
      - name: "Gotify"
        type: "Gotify"
        icon: "fas fa-bell"
        endpoint: "/dummy-data/gotify"
        apikey: "demo"
      - name: "Docuseal"
        type: "Docuseal"
        icon: "fas fa-file-signature"
        endpoint: "/dummy-data/docuseal"
      - name: "Paperless-ngx"
        type: "PaperlessNG"
