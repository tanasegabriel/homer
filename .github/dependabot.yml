version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 8
    labels:
      - dependencies
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: pnpm
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 8
    labels:
      - dependencies
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 8
    labels:
      - dependencies
    groups:
      docker:
        patterns: ["*"]
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
